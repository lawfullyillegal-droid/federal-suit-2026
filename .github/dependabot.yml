# Dependabot configuration for federal-suit-2026
# Keeps GitHub Actions dependencies up-to-date
# for institutional transparency and CI integrity
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
