name: Automated Court Audit Pipeline

on:
  schedule:
    - cron: '0 13 * * *' # Fires automatically every day
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Layout
        uses: actions/checkout@v6

      - name: Set up Python Environment
        uses: actions/setup-python@v6
        with:
          python-python-version: '3.11'

      - name: Inject Secure Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pandas

      - name: Execute Intercept Pipeline Engine
        run: python alpha_sync_final.py
