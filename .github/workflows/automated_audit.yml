name: Automated Court Audit Pipeline

on:
  schedule:
    - cron: '0 13 * * *' # Runs at 13:00 UTC every day
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Layout
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up Python Environment
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Inject Secure Core Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf pandas scipy

      - name: Execute Intercept Pipeline Engine
        run: python alpha_sync_final.py
