name: Repository Validation Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Multi-Format Validation & Artifact Collection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate YAML
        run: |
          pip install pyyaml -q
          find . -name '*.yml' -o -name '*.yaml' | grep -v node_modules | while read f; do
            python -c "import yaml; yaml.safe_load(open('$f'))" && echo "✓ $f" || (echo "✗ $f"; exit 1)
          done

      - name: Validate JSON
        run: |
          find . -name '*.json' -o -name '*.jsonl' | grep -v node_modules | while read f; do
            python -m json.tool "$f" > /dev/null && echo "✓ $f" || (echo "✗ $f"; exit 1)
          done

      - name: Check Markdown
        run: |
          pip install mdl -q
          find . -name '*.md' | while read f; do
            if [ -f "$f" ]; then
              wc -l "$f"
            fi
          done

      - name: Collect Evidence Artifacts
        if: always()
        run: |
          mkdir -p evidence-artifacts
          echo "Validation Report: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" > evidence-artifacts/validation-report.txt
          echo "Git HEAD: $(git rev-parse HEAD)" >> evidence-artifacts/validation-report.txt
          find . -type f \( -name '*.csv' -o -name '*.json' -o -name '*.yaml' \) | head -20 | while read f; do
            echo "- $f" >> evidence-artifacts/validation-report.txt
          done

      - name: Upload Validation Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: validation-${{ github.sha }}
          path: evidence-artifacts/
          retention-days: 90
          if-no-files-found: warn
