<!DOCTYPE html>
<html>
<head>
<title>EnforceAI Login</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white flex items-center justify-center min-h-screen">
<div class="bg-gray-900 p-8 rounded-2xl max-w-md w-full">
<h1 class="text-4xl font-bold text-center mb-2">EnforceAI</h1>
<p class="text-center text-red-500 mb-8">Public Accountability • Private Power</p>
<form method="POST">
<input type="email" name="email" placeholder="Email" value="test@example.com" class="w-full p-4 bg-gray-800 rounded mb-4">
<input type="password" name="password" placeholder="Password" value="password123" class="w-full p-4 bg-gray-800 rounded mb-6">
<button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-4 rounded-xl font-bold text-lg">LOGIN</button>
</form>
<p class="text-center mt-6 text-gray-400">Test login: test@example.com / password123</p>
</div>
</body>
</html>
